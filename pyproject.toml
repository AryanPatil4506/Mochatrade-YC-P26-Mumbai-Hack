[project]
name = "sentinel"
version = "0.1.0"
description = "Sentinel AI — runtime security gateway for autonomous AI agents"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2",
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "httpx>=0.27.0",
    "pyyaml>=6.0",
    "sse-starlette>=2.0.0",
    "langgraph",
    "langchain-core",
    "openai>=1.0.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-asyncio"]

[tool.setuptools.packages.find]
where = ["packages", "services", "labs"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
